    <script>

            },
            cryptoWallets: {
                USDT_TRC20: {
                    label: "USDT (TRC20):",
                    address: "TX1z9ShawoN772TRC20SecureVaultX99"
                },
                USDT_ERC20: {
                    label: "USDT (ERC20):",
                    address: "0xShawonSecureVaultERC2099999999"
                },
                USDT_BEP20: {

                },

            tradingNodes: {

                    platform: "XM Global MT5",
                    server: "XM-Global-MT5 03",
                    login: "84291045",
                    password: "Shawon#Quant99!"
                },
                WeMasterTrade: {
                    platform: "WeMasterTrade Evaluation",
                    server: "WeMasterTrade-Live Server",
                    login: "WMTR-998214",
                    password: "Shawon#WMTR2026!"
                },
                FundingTraders: {
                    platform: "FundingTraders Funded Node",
                    server: "FundingTraders-Server 01",
                    login: "FT-449102",
                    password: "Shawon#FTMaster!"
                },
                AquaFunded: {
                    platform: "AquaFunded Terminal",
                    server: "AquaFunded-Pro Execution",
                    login: "AQ-771829",
                    password: "Shawon#Aqua2026!"
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initApp();

            setInterval(() => {
                const now = new Date();
                const clockElem = document.getElementById('live-clock');
                if (clockElem && now.toLocaleTimeString) {
                    clockElem.innerText = now.toLocaleTimeString();
                }

            initMatrixCanvas();
        });

        function initApp() {
            if (!SITE_CONFIG) return;

            const nameElems = [document.getElementById('profile-name'), document.getElementById('profile-name-main')];
            nameElems.forEach(el => { if (el) el.innerText = SITE_CONFIG.profile.name; });

            const titleElems = [document.getElementById('profile-title'), document.getElementById('profile-title-main')];
            titleElems.forEach(el => { if (el) el.innerText = SITE_CONFIG.profile.title; });

            const bioElem = document.getElementById('profile-bio');
            if (bioElem) bioElem.innerText = SITE_CONFIG.profile.bio;

            const linkedinLink = document.getElementById('linkedin-link');
            if (linkedinLink) linkedinLink.href = SITE_CONFIG.profile.linkedin;

            const emailLink = document.getElementById('email-link');
            if (emailLink) emailLink.href = 'mailto:' + SITE_CONFIG.profile.email;

            const emailText = document.getElementById('email-text');
            if (emailText) emailText.innerText = SITE_CONFIG.profile.email;

            const footerCopyright = document.getElementById('footer-copyright');
            if (footerCopyright) footerCopyright.innerText = `© 2026 ${SITE_CONFIG.profile.name}`;

            window.updateCryptoPayment();
            window.updateInvestorPlatform();
        }

        window.updateCryptoPayment = function() {
            const select = document.getElementById('crypto-selector');
            if (!select) return;
            const selectedVal = select.value;
            const data = SITE_CONFIG.cryptoWallets[selectedVal];
            if (!data) return;
            document.getElementById('crypto-label').innerText = data.label;
            document.getElementById('crypto-address').innerText = data.address;
            
            // Render QR Code smoothly using QRCodeJS library
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: data.address,
                width: 64,
                height: 64,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.copyAddress = function() {
            const addressText = document.getElementById('crypto-address').innerText;
            navigator.clipboard.writeText(addressText);
            alert('Secure Crypto Hash Copied to Clipboard!');
        }

        window.updateInvestorPlatform = function() {
            const selElem = document.getElementById('platform-selector');
            if (!selElem) return;
            const selVal = selElem.value;
            const data = SITE_CONFIG.tradingNodes[selVal];
            if (!data) return;
            document.getElementById('inv-platform').innerText = data.platform;
            document.getElementById('inv-server').innerText = data.server;
            document.getElementById('inv-login').innerText = data.login;
            document.getElementById('inv-pass').innerText = data.password;
        }

        window.toggleInvestorCredentials = function() {
            const creds = document.getElementById('investor-credentials');
            const iconElem = document.getElementById('eye-icon');
            const toggleText = document.getElementById('toggle-text');
            if (!creds) return;
            if (creds.classList.contains('hidden')) {
                creds.classList.remove('hidden');
                iconElem.classList.remove('fa-eye');
                iconElem.classList.add('fa-eye-slash');
                toggleText.innerText = 'ENCRYPT';
            } else {
                creds.classList.add('hidden');
                iconElem.classList.remove('fa-eye-slash');
                iconElem.classList.add('fa-eye');
                toggleText.innerText = 'DECRYPT';
            }
        }

        function initMatrixCanvas() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const chars = '01ABCDEFGHJKLMNOPQRSTUVWXYZ0123456789<>/\\[]#$_;';
            const fontSize = 14;
            const columns = Math.floor(width / fontSize);
            const drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -100);
            }

            function draw() {
                ctx.fillStyle = 'rgba(2, 11, 5, 0.15)';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#00ff66';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }

        window.toggleTheme = function() {
            const body = document.body;
            if(body.style.backgroundColor === 'rgb(2, 11, 5)' || body.style.backgroundColor === '') {
                body.style.backgroundColor = '#111827';
            } else {
                body.style.backgroundColor = '#020b05';
            }
        }
    </script>
